<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penduduk Indonesia Per Provinsi 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0ece4;
      font-family: 'IBM Plex Mono', monospace;
    }

    .wrapper {
      min-height: 100vh;
      background: #0a0a0a;
      padding: 48px 32px 80px;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 48px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 32px;
    }

    .kicker {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #e05c2a;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      line-height: 1.05;
      color: #f0ece4;
      margin-bottom: 16px;
    }

    h1 span { color: #e05c2a; }

    .meta {
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .meta strong { color: #f0ece4; }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }

    .controls label {
      font-size: 11px;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .btn {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 6px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .btn.active {
      background: #e05c2a;
      border-color: #e05c2a;
      color: #fff;
    }

    .btn:hover:not(.active) { border-color: #666; color: #ccc; }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .pill {
      background: none;
      border: 1px solid #2a2a2a;
      color: #666;
      padding: 5px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill:hover { border-color: #444; color: #bbb; }
    .pill.pill-active { color: #0a0a0a; border-color: transparent; }

    .pill-swatch {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }

    .chart { display: flex; flex-direction: column; gap: 5px; }

    .row {
      display: grid;
      grid-template-columns: 180px 1fr 90px;
      align-items: center;
      gap: 12px;
      padding: 5px 0;
      cursor: default;
      transition: opacity 0.2s;
    }

    .chart.has-hover .row:not(.hovered) { opacity: 0.3; }

    .label {
      font-size: 11.5px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s;
      letter-spacing: 0.02em;
    }

    .row.hovered .label { color: #f0ece4 !important; }

    .bar-track {
      height: 22px;
      background: #161616;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bar-fill.visible { transform: scaleX(1); }

    .value {
      font-size: 11px;
      color: #666;
      text-align: right;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .row.hovered .value { color: #f0ece4; }

    .rank {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: rgba(255,255,255,0.25);
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: none;
    }

    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .stat-box {
      background: #111;
      border: 1px solid #1e1e1e;
      padding: 16px 20px;
      min-width: 140px;
    }

    .stat-label {
      font-size: 10px;
      color: #555;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #e05c2a;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <p class="kicker">Badan Pusat Statistik · 2025</p>
      <h1>Penduduk <span>Indonesia</span><br>Per Provinsi</h1>
      <div class="meta">
        <span>Sumber: BPS</span>
        <span>Satuan: <strong>Ribu Jiwa</strong></span>
        <span>Total: <strong>284.438,8 ribu jiwa</strong></span>
        <span id="meta-jumlah"></span>
      </div>
    </div>

    <div class="controls">
      <label>Urutkan:</label>
      <button class="btn active" id="btn-desc" onclick="setSort('desc')">Terbesar</button>
      <button class="btn" id="btn-az" onclick="setSort('az')">A–Z</button>
    </div>

    <div class="filter-pills" id="pills"></div>
    <div class="chart" id="chart"></div>

    <div class="footer">
      <div class="stat-box">
        <div class="stat-label">Provinsi Terbesar</div>
        <div class="stat-value">Jawa Barat</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Nasional</div>
        <div class="stat-value">284,4 Juta</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Jumlah Provinsi</div>
        <div class="stat-value" id="stat-provinsi"></div>
      </div>
    </div>
  </div>

  <script>
    const pulauMap = {
      "Jawa":                 ["Jawa Barat","Jawa Timur","Jawa Tengah","DKI Jakarta","Banten","DI Yogyakarta"],
      "Sumatera":             ["Aceh","Sumatera Utara","Sumatera Barat","Riau","Kepulauan Riau","Jambi","Sumatera Selatan","Bangka Belitung","Bengkulu","Lampung"],
      "Kalimantan":           ["Kalimantan Barat","Kalimantan Tengah","Kalimantan Selatan","Kalimantan Timur","Kalimantan Utara"],
      "Sulawesi":             ["Sulawesi Utara","Gorontalo","Sulawesi Tengah","Sulawesi Barat","Sulawesi Selatan","Sulawesi Tenggara"],
      "Nusa Tenggara & Bali": ["Nusa Tenggara Barat","Nusa Tenggara Timur","Bali"],
      "Maluku":               ["Maluku","Maluku Utara"],
      "Papua":                ["Papua","Papua Barat","Papua Selatan","Papua Tengah","Papua Pegunungan","Papua Barat Daya"],
    };

    const pulauColors = {
      "Jawa":                   "#e05c2a",
      "Sumatera":               "#2a9de0",
      "Kalimantan":             "#27ae60",
      "Sulawesi":               "#9b59b6",
      "Nusa Tenggara & Bali":   "#e8c030",
      "Maluku":                 "#e0609a",
      "Papua":                  "#1abc9c",
    };

    const provinsiToPulau = {};
    for (const [pulau, list] of Object.entries(pulauMap)) {
      for (const p of list) provinsiToPulau[p] = pulau;
    }

    const getPulau = p => provinsiToPulau[p] || "Lainnya";
    const getColor = p => pulauColors[getPulau(p)] || "#888";

    const rawData = [
      { provinsi: "Jawa Barat",          penduduk: 49935.6 },
      { provinsi: "Jawa Timur",          penduduk: 41682.7 },
      { provinsi: "Jawa Tengah",         penduduk: 37032.4 },
      { provinsi: "Sumatera Utara",      penduduk: 15447.5 },
      { provinsi: "Banten",              penduduk: 13005.5 },
      { provinsi: "DKI Jakarta",         penduduk: 11249.5 },
      { provinsi: "Sulawesi Selatan",    penduduk: 9453.7  },
      { provinsi: "Lampung",             penduduk: 9169.2  },
      { provinsi: "Sumatera Selatan",    penduduk: 8760.3  },
      { provinsi: "Riau",                penduduk: 7185.4  },
      { provinsi: "Nusa Tenggara Timur", penduduk: 6000.3  },
      { provinsi: "Sumatera Barat",      penduduk: 5715.0  },
      { provinsi: "Nusa Tenggara Barat", penduduk: 5619.9  },
      { provinsi: "Kalimantan Barat",    penduduk: 5470.3  },
      { provinsi: "Aceh",                penduduk: 5554.5  },
      { provinsi: "Kalimantan Selatan",  penduduk: 4333.3  },
      { provinsi: "Kalimantan Timur",    penduduk: 4004.6  },
      { provinsi: "DI Yogyakarta",       penduduk: 3968.2  },
      { provinsi: "Jambi",               penduduk: 3748.8  },
      { provinsi: "Sulawesi Tengah",     penduduk: 3186.7  },
      { provinsi: "Kalimantan Tengah",   penduduk: 2883.5  },
      { provinsi: "Sulawesi Tenggara",   penduduk: 2850.5  },
      { provinsi: "Sulawesi Utara",      penduduk: 2680.3  },
      { provinsi: "Kepulauan Riau",      penduduk: 2369.2  },
      { provinsi: "Bengkulu",            penduduk: 2161.6  },
      { provinsi: "Maluku",              penduduk: 1939.8  },
      { provinsi: "Papua Pegunungan",    penduduk: 1397.6  },
      { provinsi: "Maluku Utara",        penduduk: 1388.3  },
      { provinsi: "Sulawesi Barat",      penduduk: 1542.9  },
      { provinsi: "Bangka Belitung",     penduduk: 1563.2  },
      { provinsi: "Gorontalo",           penduduk: 1259.5  },
      { provinsi: "Papua",               penduduk: 1162.2  },
      { provinsi: "Papua Tengah",        penduduk: 1137.9  },
      { provinsi: "Papua Barat Daya",    penduduk: 667.4   },
      { provinsi: "Papua Selatan",       penduduk: 611.3   },
      { provinsi: "Papua Barat",         penduduk: 534.8   },
      { provinsi: "Kalimantan Utara",    penduduk: 769.3   },
    ];

    const data = rawData.sort((a, b) => b.penduduk - a.penduduk);
    const maxVal = data[0].penduduk;

    let sortBy = 'desc';
    let filterPulau = 'Semua';

    document.getElementById('meta-jumlah').textContent = data.length + ' provinsi';
    document.getElementById('stat-provinsi').textContent = data.length;

    function fmt(n) {
      return n.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function setSort(s) {
      sortBy = s;
      document.getElementById('btn-desc').classList.toggle('active', s === 'desc');
      document.getElementById('btn-az').classList.toggle('active', s === 'az');
      render();
    }

    function setFilter(pulau) {
      filterPulau = pulau;
      renderPills();
      render();
    }

    function renderPills() {
      const container = document.getElementById('pills');
      container.innerHTML = '';

      // "Semua" pill
      const all = document.createElement('button');
      all.className = 'pill' + (filterPulau === 'Semua' ? ' pill-active' : '');
      all.style.cssText = filterPulau === 'Semua' ? 'background:#f0ece4;' : '';
      all.onclick = () => setFilter('Semua');
      all.innerHTML = `<span class="pill-swatch" style="background:conic-gradient(#e05c2a 0 14%,#2a9de0 14% 42%,#27ae60 42% 56%,#9b59b6 56% 72%,#e8c030 72% 84%,#e0609a 84% 92%,#1abc9c 92% 100%);"></span>Semua`;
      container.appendChild(all);

      for (const pulau of Object.keys(pulauMap)) {
        const color = pulauColors[pulau];
        const btn = document.createElement('button');
        btn.className = 'pill' + (filterPulau === pulau ? ' pill-active' : '');
        btn.style.cssText = filterPulau === pulau
          ? `background:${color};`
          : `border-color:${color}33;`;
        btn.onclick = () => setFilter(pulau);
        btn.innerHTML = `<span class="pill-swatch" style="background:${color};"></span>${pulau}`;
        container.appendChild(btn);
      }
    }

    function render() {
      const filtered = filterPulau === 'Semua'
        ? [...data]
        : data.filter(d => getPulau(d.provinsi) === filterPulau);

      const sorted = sortBy === 'desc'
        ? filtered.sort((a, b) => b.penduduk - a.penduduk)
        : filtered.sort((a, b) => a.provinsi.localeCompare(b.provinsi, 'id'));

      const chart = document.getElementById('chart');
      chart.innerHTML = '';

      sorted.forEach((row, i) => {
        const pct = row.penduduk / maxVal;
        const rank = data.findIndex(d => d.provinsi === row.provinsi) + 1;
        const color = getColor(row.provinsi);

        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
          <span class="label" style="color:${color}bb">${row.provinsi}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct * 100}%;background:${color};transition-delay:${i * 0.03}s;"></div>
            <span class="rank">#${rank}</span>
          </div>
          <span class="value">${fmt(row.penduduk)}</span>
        `;

        div.addEventListener('mouseenter', () => {
          chart.classList.add('has-hover');
          div.classList.add('hovered');
          div.querySelector('.label').style.color = '#f0ece4';
        });
        div.addEventListener('mouseleave', () => {
          chart.classList.remove('has-hover');
          div.classList.remove('hovered');
          div.querySelector('.label').style.color = color + 'bb';
        });

        chart.appendChild(div);
      });

      // Trigger bar animation after paint
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          chart.querySelectorAll('.bar-fill').forEach(el => el.classList.add('visible'));
        });
      });
    }

    renderPills();
    render();
  </script>
</body>
</html>
